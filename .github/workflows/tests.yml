name: Application tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SEATING_DATABASE: /tmp/gphem-ci-bootstrap.sqlite
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install local PDF tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Run automated tests
        run: python -m pytest -q
      - name: Check template rendering
        run: python scripts/check_templates.py

  postgresql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: gphem_test
          POSTGRES_USER: gphem_test
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gphem_test -d gphem_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SEATING_DATABASE: /tmp/gphem-ci-bootstrap.sqlite
      GPHEM_TEST_DATABASE_URL: postgresql://gphem_test:ci-only-password@127.0.0.1:5432/gphem_test?sslmode=disable
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install PDF tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils ghostscript
      - name: Install Python packages
        run: python -m pip install -r requirements-dev.txt
      - name: Test application against isolated PostgreSQL schemas
        run: python -m pytest -q
